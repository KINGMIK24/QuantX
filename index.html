    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
            LineChart, Line, AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, 
            ResponsiveContainer, PieChart, Pie, Sector, Cell, ReferenceArea, BarChart, Bar 
        } = window.Recharts;

        // --- Mock Data Generators ---
        const generateChartData = () => {
            let data = [];
            let price = 250;
            for(let i=0; i<150; i++) {
                price += Math.random() * 10 - 4.5;
                let macd = Math.random() * 4 - 2;
                data.push({
                    time: `10:${i < 10 ? '0'+i : i}`,
                    price: Number(price.toFixed(2)),
                    macd: Number(macd.toFixed(2)),
                    rsi: Number((40 + Math.random() * 40).toFixed(2))
                });
            }
            return data;
        };

        const trendingData = [
            { symbol: 'NVDA', impact: 92, change: 4.5 },
            { symbol: 'TSLA', impact: 85, change: -1.2 },
            { symbol: 'AAPL', impact: 78, change: 0.8 },
            { symbol: 'AMD', impact: 75, change: 2.3 },
            { symbol: 'MSFT', impact: 60, change: -0.4 },
        ];

        // --- Shared Components ---

        const ThreeBackground = () => {
            const mountRef = useRef(null);

            useEffect(() => {
                const W = window.innerWidth;
                const H = window.innerHeight;
                const renderer = new window.THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(W, H);
                renderer.setPixelRatio(window.devicePixelRatio);
                mountRef.current.appendChild(renderer.domElement);

                const scene = new window.THREE.Scene();
                // Match the image's blue gradient background
                scene.background = new window.THREE.Color(0x003399);
                scene.fog = new window.THREE.FogExp2(0x003399, 0.002);

                const camera = new window.THREE.PerspectiveCamera(75, W / H, 0.1, 1000);
                camera.position.z = 25;
                camera.position.y = 5;

                // Create a smooth plane for the wavy gradient
                const geometry = new window.THREE.PlaneGeometry(200, 100, 100, 50);
                
                // Shader Material for the gradient and wave
                const vertexShader = `
                    varying vec2 vUv;
                    varying float vElevation;
                    uniform float uTime;
                    
                    // Simple 3D noise function
                    vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
                    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
                    vec3 fade(vec3 t) {return t*t*t*(t*(t*6.0-15.0)+10.0);}
                    
                    float cnoise(vec3 P){
                      vec3 Pi0 = floor(P);
                      vec3 Pi1 = Pi0 + vec3(1.0);
                      Pi0 = mod(Pi0, 289.0);
                      Pi1 = mod(Pi1, 289.0);
                      vec3 Pf0 = fract(P);
                      vec3 Pf1 = Pf0 - vec3(1.0);
                      vec4 ix = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
                      vec4 iy = vec4(Pi0.yy, Pi1.yy);
                      vec4 iz0 = Pi0.zzzz;
                      vec4 iz1 = Pi1.zzzz;
                      
                      vec4 ixy = permute(permute(ix) + iy);
                      vec4 ixy0 = permute(ixy + iz0);
                      vec4 ixy1 = permute(ixy + iz1);
                      
                      vec4 gx0 = ixy0 / 7.0;
                      vec4 gy0 = fract(floor(gx0) / 7.0) - 0.5;
                      gx0 = fract(gx0);
                      vec4 gz0 = vec4(0.5) - abs(gx0) - abs(gy0);
                      vec4 sz0 = step(gz0, vec4(0.0));
                      gx0 -= sz0 * (step(0.0, gx0) - 0.5);
                      gy0 -= sz0 * (step(0.0, gy0) - 0.5);
                      
                      vec4 gx1 = ixy1 / 7.0;
                      vec4 gy1 = fract(floor(gx1) / 7.0) - 0.5;
                      gx1 = fract(gx1);
                      vec4 gz1 = vec4(0.5) - abs(gx1) - abs(gy1);
                      vec4 sz1 = step(gz1, vec4(0.0));
                      gx1 -= sz1 * (step(0.0, gx1) - 0.5);
                      gy1 -= sz1 * (step(0.0, gy1) - 0.5);
                      
                      vec3 g000 = vec3(gx0.x,gy0.x,gz0.x);
                      vec3 g100 = vec3(gx0.y,gy0.y,gz0.y);
                      vec3 g010 = vec3(gx0.z,gy0.z,gz0.z);
                      vec3 g110 = vec3(gx0.w,gy0.w,gz0.w);
                      vec3 g001 = vec3(gx1.x,gy1.x,gz1.x);
                      vec3 g101 = vec3(gx1.y,gy1.y,gz1.y);
                      vec3 g011 = vec3(gx1.z,gy1.z,gz1.z);
                      vec3 g111 = vec3(gx1.w,gy1.w,gz1.w);
                      
                      vec4 norm0 = taylorInvSqrt(vec4(dot(g000, g000), dot(g010, g010), dot(g100, g100), dot(g110, g110)));
                      g000 *= norm0.x;
                      g010 *= norm0.y;
                      g100 *= norm0.z;
                      g110 *= norm0.w;
                      vec4 norm1 = taylorInvSqrt(vec4(dot(g001, g001), dot(g011, g011), dot(g101, g101), dot(g111, g111)));
                      g001 *= norm1.x;
                      g011 *= norm1.y;
                      g101 *= norm1.z;
                      g111 *= norm1.w;
                      
                      float n000 = dot(g000, Pf0);
                      float n100 = dot(g100, vec3(Pf1.x, Pf0.yz));
                      float n010 = dot(g010, vec3(Pf0.x, Pf1.y, Pf0.z));
                      float n110 = dot(g110, vec3(Pf1.xy, Pf0.z));
                      float n001 = dot(g001, vec3(Pf0.xy, Pf1.z));
                      float n101 = dot(g101, vec3(Pf1.x, Pf0.y, Pf1.z));
                      float n011 = dot(g011, vec3(Pf0.x, Pf1.yz));
                      float n111 = dot(g111, Pf1);
                      
                      vec3 fade_xyz = fade(Pf0);
                      vec4 n_z = mix(vec4(n000, n100, n010, n110), vec4(n001, n101, n011, n111), fade_xyz.z);
                      vec2 n_yz = mix(n_z.xy, n_z.zw, fade_xyz.y);
                      float n_xyz = mix(n_yz.x, n_yz.y, fade_xyz.x); 
                      return 2.2 * n_xyz;
                    }

                    void main() {
                        vUv = uv;
                        vec3 pos = position;
                        float noiseFreq = 0.03;
                        float noiseAmp = 8.0;
                        vec3 noisePos = vec3(pos.x * noiseFreq + uTime * 0.05, pos.y * noiseFreq + uTime * 0.05, pos.z);
                        float elevation = cnoise(noisePos) * noiseAmp;
                        
                        // Secondary detail
                        elevation += cnoise(noisePos * 2.0) * (noiseAmp * 0.2);
                        
                        pos.z += elevation;
                        vElevation = elevation;
                        
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `;

                const fragmentShader = `
                    varying vec2 vUv;
                    varying float vElevation;
                    
                    // Colors matching the image gradient (Light blue to deep blue)
                    vec3 color1 = vec3(0.25, 0.65, 0.95); // Light Blue
                    vec3 color2 = vec3(0.05, 0.35, 0.85); // Mid Blue
                    vec3 color3 = vec3(0.00, 0.15, 0.60); // Dark Blue
                    
                    void main() {
                        float mixStrength = (vElevation + 8.0) / 16.0;
                        vec3 finalColor = mix(color3, color1, smoothstep(0.0, 1.0, mixStrength));
                        
                        // Add highlights
                        float highlight = smoothstep(0.7, 1.0, mixStrength);
                        finalColor += highlight * vec3(0.3, 0.8, 1.0) * 0.4;
                        
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `;

                const material = new window.THREE.ShaderMaterial({
                    vertexShader,
                    fragmentShader,
                    uniforms: {
                        uTime: { value: 0 }
                    },
                    wireframe: false,
                    side: window.THREE.DoubleSide
                });
                
                const plane = new window.THREE.Mesh(geometry, material);
                plane.rotation.x = -Math.PI / 2;
                plane.position.y = -5;
                scene.add(plane);

                // Re-add particles for some interactive depth and keep the onClick events working
                const pGeo = new window.THREE.BufferGeometry();
                const pCount = 600;
                const pArr = new Float32Array(pCount * 3);
                for(let i=0; i<pCount*3; i++) {
                    pArr[i] = (Math.random() - 0.5) * 150;
                }
                pGeo.setAttribute('position', new window.THREE.BufferAttribute(pArr, 3));
                const pMat = new window.THREE.PointsMaterial({ 
                    color: 0x88ccff, 
                    size: 0.3, 
                    transparent: true, 
                    opacity: 0.5,
                    blending: window.THREE.AdditiveBlending
                });
                const points = new window.THREE.Points(pGeo, pMat);
                scene.add(points);

                let mouseX = 0;
                let mouseY = 0;
                const onMouseMove = (e) => {
                    mouseX = (e.clientX / W) * 2 - 1;
                    mouseY = -(e.clientY / H) * 2 + 1;
                };
                window.addEventListener('mousemove', onMouseMove);

                const raycaster = new window.THREE.Raycaster();
                raycaster.params.Points.threshold = 1.0;
                const mouse = new window.THREE.Vector2();

                const onClick = (e) => {
                    mouse.x = (e.clientX / W) * 2 - 1;
                    mouse.y = -(e.clientY / H) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObject(points);
                    if (intersects.length > 0) {
                        const ringGeo = new window.THREE.RingGeometry(0.5, 1, 16);
                        const ringMat = new window.THREE.MeshBasicMaterial({ color: 0xaaddff, side: window.THREE.DoubleSide, transparent: true, opacity: 0.8 });
                        const ring = new window.THREE.Mesh(ringGeo, ringMat);
                        ring.position.copy(intersects[0].point);
                        ring.lookAt(camera.position);
                        scene.add(ring);
                        
                        const event = new CustomEvent('threeNodeClick', { detail: { id: Math.floor(Math.random() * 8) + 1 } });
                        window.dispatchEvent(event);

                        let s = 1;
                        const ringAnim = setInterval(() => {
                            s += 0.1;
                            ring.scale.set(s, s, s);
                            ring.material.opacity -= 0.05;
                            if(ring.material.opacity <= 0) {
                                scene.remove(ring);
                                clearInterval(ringAnim);
                            }
                        }, 30);
                    }
                };
                window.addEventListener('click', onClick);

                const clock = new window.THREE.Clock();
                let animationFrameId;
                
                const animate = () => {
                    animationFrameId = requestAnimationFrame(animate);
                    const elapsedTime = clock.getElapsedTime();
                    
                    // Update shader time
                    material.uniforms.uTime.value = elapsedTime;

                    camera.position.x += (mouseX * 10 - camera.position.x) * 0.05;
                    camera.position.y += ((mouseY * 5 + 10) - camera.position.y) * 0.05;
                    camera.lookAt(scene.position);
                    
                    points.rotation.y = elapsedTime * 0.02;

                    renderer.render(scene, camera);
                };
                animate();

                const onResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };
                window.addEventListener('resize', onResize);

                return () => {
                    cancelAnimationFrame(animationFrameId);
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('click', onClick);
                    window.removeEventListener('resize', onResize);
                    if(mountRef.current && mountRef.current.contains(renderer.domElement)) {
                        mountRef.current.removeChild(renderer.domElement);
                    }
                };
            }, []);

            return <div id="three-canvas" ref={mountRef}></div>;
        };

        const BirdAnimation = () => {
            const birdRef = useRef(null);

            useEffect(() => {
                const bird = birdRef.current;
                if(!bird) return;

                const W = window.innerWidth;
                const H = window.innerHeight;
                
                const startX = -100;
                const startY = H * 0.7;
                const cp1x = W * 0.3;
                const cp1y = H * 0.2;
                const cp2x = W * 0.7;
                const cp2y = H * 0.8;
                const endX = W + 100;
                const endY = H * 0.3;

                let startTime = null;
                const duration = 6000;

                const cubicBezier = (t, p0, p1, p2, p3) => {
                    const u = 1 - t;
                    return u*u*u*p0 + 3*u*u*t*p1 + 3*u*t*t*p2 + t*t*t*p3;
                };

                let animationFrameId;
                const animate = (ts) => {
                    if(!startTime) startTime = ts;
                    const elapsed = ts - startTime;
                    const p = Math.min(elapsed / duration, 1);
                    
                    const bx = cubicBezier(p, startX, cp1x, cp2x, endX);
                    const by = cubicBezier(p, startY, cp1y, cp2y, endY);
                    
                    const dp = Math.min(p + 0.01, 1);
                    const nx = cubicBezier(dp, startX, cp1x, cp2x, endX);
                    const ny = cubicBezier(dp, startY, cp1y, cp2y, endY);
                    const angle = Math.atan2(ny - by, nx - bx);

                    bird.style.opacity = p < 0.1 ? p * 10 : p > 0.9 ? (1 - p) * 10 : 1;
                    bird.style.left = `${bx - 50}px`;
                    bird.style.top = `${by - 35}px`;
                    bird.style.transform = `rotate(${angle}rad) scale(${1 + Math.sin(p * Math.PI * 20) * 0.1})`;

                    if (p < 1) {
                        animationFrameId = requestAnimationFrame(animate);
                    }
                };

                const timeoutId = setTimeout(() => { animationFrameId = requestAnimationFrame(animate); }, 500);

                return () => {
                    clearTimeout(timeoutId);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return (
                <svg id="cineBird" ref={birdRef} viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">
                    <g fill="#34d399">
                        <path d="M48,35 C44,30 38,27 30,29 C22,31 14,37 8,43 C14,39 21,37 28,38 C34,39 40,43 45,45 C49,47 53,46 56,43 C59,40 61,37 63,34 C67,29 72,26 78,28 C74,31 70,35 68,40 C66,44 65,49 66,54 C69,48 72,43 77,39 C82,35 88,33 94,34 C88,30 81,27 74,26 C67,25 60,28 55,34 Z"/>
                        <circle cx="28" cy="30" r="5"/>
                        <path d="M57,32 C62,24 70,19 80,18 C74,24 68,30 64,36 Z"/>
                        <path d="M58,44 C65,50 74,53 85,51 C78,47 71,43 66,39 Z"/>
                        <path d="M67,52 C70,57 75,62 80,64 C76,58 72,53 70,47 Z"/>
                        <path d="M68,50 C74,52 82,50 90,46 C83,46 76,48 72,48 Z"/>
                    </g>
                </svg>
            );
        };

        const ThreeDataChart = ({ data }) => {
            const mountRef = useRef(null);

            useEffect(() => {
                if (!mountRef.current) return;
                const W = mountRef.current.clientWidth || window.innerWidth * 0.8;
                const H = mountRef.current.clientHeight || 400;
                const renderer = new window.THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(W, H);
                mountRef.current.appendChild(renderer.domElement);

                const scene = new window.THREE.Scene();
                const camera = new window.THREE.PerspectiveCamera(60, W / H, 0.1, 1000);
                camera.position.set(0, 15, 60);

                const group = new window.THREE.Group();
                scene.add(group);

                const barWidth = 0.4;
                const maxPrice = Math.max(...data.map(d => d.price));
                const minPrice = Math.min(...data.map(d => d.price));
                
                const material = new window.THREE.MeshStandardMaterial({ 
                    color: 0x34d399, 
                    metalness: 0.8, 
                    roughness: 0.2,
                    transparent: true,
                    opacity: 0.9
                });
                
                data.forEach((d, i) => {
                    const height = ((d.price - minPrice) / (maxPrice - minPrice)) * 20 + 2;
                    const geometry = new window.THREE.BoxGeometry(barWidth, height, barWidth);
                    const mesh = new window.THREE.Mesh(geometry, material);
                    
                    mesh.position.x = (i - data.length / 2) * (barWidth + 0.1);
                    mesh.position.y = height / 2;
                    mesh.position.z = Math.sin(i * 0.1) * 5; 
                    
                    group.add(mesh);
                });

                const light = new window.THREE.DirectionalLight(0xffffff, 1);
                light.position.set(10, 20, 30);
                scene.add(light);
                const ambient = new window.THREE.AmbientLight(0x0a84ff, 0.5);
                scene.add(ambient);

                let mouseX = 0;
                let mouseY = 0;
                const onMouseMove = (e) => {
                    const rect = mountRef.current.getBoundingClientRect();
                    mouseX = ((e.clientX - rect.left) / W) * 2 - 1;
                    mouseY = -((e.clientY - rect.top) / H) * 2 + 1;
                };
                mountRef.current.addEventListener('mousemove', onMouseMove);

                let animationFrameId;
                let angle = 0;
                const animate = () => {
                    animationFrameId = requestAnimationFrame(animate);
                    group.rotation.y += (mouseX * 0.5 - group.rotation.y) * 0.05;
                    group.rotation.x += (-mouseY * 0.2 - group.rotation.x) * 0.05;
                    renderer.render(scene, camera);
                };
                animate();

                const onResize = () => {
                    if (!mountRef.current) return;
                    const nW = mountRef.current.clientWidth;
                    const nH = mountRef.current.clientHeight;
                    camera.aspect = nW / nH;
                    camera.updateProjectionMatrix();
                    renderer.setSize(nW, nH);
                };
                window.addEventListener('resize', onResize);

                return () => {
                    cancelAnimationFrame(animationFrameId);
                    window.removeEventListener('resize', onResize);
                    if(mountRef.current) {
                        mountRef.current.removeEventListener('mousemove', onMouseMove);
                        if(mountRef.current.contains(renderer.domElement)) {
                            mountRef.current.removeChild(renderer.domElement);
                        }
                    }
                };
            }, [data]);

            return <div ref={mountRef} className="w-full h-full cursor-crosshair"></div>;

                                        <div className="bg-blue-600/30 p-3 rounded-2xl rounded-tr-none text-xs text-white font-sans border border-blue-500/30 shadow-sm leading-relaxed backdrop-blur-md">
                                            Yes, show me key changes.
                                        </div>
                                    </div>
                                    <div className="w-6 h-6 rounded-full bg-blue-500/20 flex items-center justify-center shrink-0 mt-1">
                                        <i data-lucide="user" size="12" className="text-blue-400"></i>
                                    </div>
                                </div>
                            </div>
                            <div className="p-3 border-t border-gray-800/50 relative shrink-0">
                                <input type="text" className="w-full bg-black/40 rounded-full pl-4 pr-10 py-2.5 text-xs text-white border border-gray-700 focus:outline-none focus:border-acid transition-colors backdrop-blur-md shadow-inner" placeholder="Type message..." />
                                <button className="absolute right-5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-acid transition-colors">
                                    <i data-lucide="send" size="14"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Bottom Section: Quantum Newsstream */}
                    <div>
                        <div className="flex justify-between items-end mb-4 border-b border-blue-400/20 pb-2">
                            <div>
                                <h2 className="text-2xl font-display font-bold text-blue-400 italic">QUANTUM NEWSSTREAM</h2>
                                <p className="text-yellow-500 text-xs font-mono uppercase tracking-widest mt-1">GROUNDING: QUANTX SEARCH ENGINE PRO</p>
                            </div>
                            <div className="text-xs text-gray-500 font-mono flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-acid animate-pulse"></span> FEED STABLE
                            </div>
                        </div>

                        {/* Tabs */}
                        <div className="flex flex-wrap gap-2 mb-6">
                            {categories.map(cat => (
                                <button 
                                    key={cat}
                                    onClick={() => setActiveCategory(cat)}
                                    className={`px-4 py-1.5 text-xs font-bold font-mono rounded-full border transition-all ${activeCategory === cat ? 'bg-blue-500/20 text-blue-400 border-blue-500/50 hover:-translate-y-1' : 'bg-void text-gray-400 border-gray-800 hover:border-gray-500 hover:text-gray-200 hover:-translate-y-1'}`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>

                        {/* News Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            {filteredNews.map(news => <NewsCard key={news.id} news={news} featured={false} onAiAssist={() => setAiModalItem(news)} />)}
                        </div>
                    </div>

                    {aiModalItem && <AIAssistantModal newsItem={aiModalItem} onClose={() => setAiModalItem(null)} />}
                </div>
            );
        };

        const AILabTab = () => {
            const [query, setQuery] = useState("");
            const [response, setResponse] = useState("");
            const [loading, setLoading] = useState(false);
            const [apiKey, setApiKey] = useState(localStorage.getItem('quantx_groq_key') || '');
            const [isConfiguring, setIsConfiguring] = useState(!localStorage.getItem('quantx_groq_key'));

            const handleSaveKey = (e) => {
                e.preventDefault();
                localStorage.setItem('quantx_groq_key', apiKey);
                setIsConfiguring(false);
            };

            const handleExecute = async () => {
                if (!query || !apiKey) return;
                setLoading(true);
                setResponse("");
                try {
                    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({ 
                            model: "llama-3.1-8b-instant",
                            messages: [{ role: "user", content: query }]
                        })
                    });
                    const data = await res.json();
                    if (data.error) {
                        setResponse(`API Error: ${data.error.message}`);
                    } else {
                        setResponse(data.choices[0].message.content);
                    }
                } catch (e) {
                    setResponse("Error connecting to AI Server. Please verify your API key or network connection.");
                }
                setLoading(false);
            };

            if (isConfiguring) {
                return (
                    <div className="h-full flex flex-col pb-10">
                        <div className="qx-card flex-1 p-6 flex flex-col items-center justify-center text-center">
                            <i data-lucide="key" size="48" className="text-acid mb-6"></i>
                            <h2 className="text-2xl font-display font-bold text-white mb-2">Configure Neural Link</h2>
                            <p className="text-gray-400 font-sans text-sm max-w-lg mb-8">
                                To enable serverless AI access on any device, please enter your Groq API key. It will be stored securely and locally on this device only.
                            </p>
                            <form onSubmit={handleSaveKey} className="w-full max-w-md relative">
                                <input 
                                    type="password" 
                                    value={apiKey}
                                    onChange={(e) => setApiKey(e.target.value)}
                                    className="w-full bg-void border border-acid/30 p-4 rounded-lg font-mono text-sm text-white focus:outline-none focus:border-acid focus:shadow-[0_0_10px_rgba(0,255,65,0.2)] transition-all mb-4" 
                                    placeholder="gsk_..." 
                                    required
                                />
                                <button type="submit" className="w-full qx-btn-primary py-3 rounded-lg text-sm font-bold tracking-widest bg-acid/20 hover:bg-acid/30 transition-colors">
                                    INITIALIZE SECURE UPLINK
                                </button>
                            </form>
                            {apiKey && (
                                <button onClick={() => setIsConfiguring(false)} className="mt-6 text-gray-500 text-xs font-mono hover:text-acid transition-colors">
                                    CANCEL CONFIGURATION
                                </button>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-full flex flex-col pb-10 relative">
                    <button 
                        onClick={() => setIsConfiguring(true)}
                        className="absolute top-4 right-4 z-50 text-gray-500 hover:text-acid p-2 rounded-full hover:bg-white/5 transition-colors"
                        title="Configure API Key"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                    <div className="qx-card flex-1 p-6 flex flex-col items-center justify-start pt-12 text-center overflow-y-auto">
                        <i data-lucide="bot" size="48" className="text-acid mb-6"></i>
                        <h2 className="text-2xl font-display font-bold text-white mb-2">QuantX AI Lab (Multi-Modal)</h2>
                        <p className="text-gray-400 font-sans text-sm max-w-lg mb-8">
                            The Multi-Modal suite allows natural language interaction with your charting engine. Ask it to find divergence, summarize sentiment, or correlate macroeconomic data.
                        </p>
                        <div className="w-full max-w-2xl relative shrink-0">
                            <input 
                                type="text" 
                                value={query}
                                onChange={(e) => setQuery(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && handleExecute()}
                                className="w-full bg-void border border-acid/30 p-4 pl-6 pr-32 rounded-full font-mono text-sm text-white focus:outline-none focus:border-acid focus:shadow-[0_0_10px_rgba(0,255,65,0.2)] transition-all" 
                                placeholder="E.g., 'Analyze the correlation between TSLA and BTC over the last 30 days...'" 
                            />
                            <button onClick={handleExecute} disabled={loading} className="absolute right-2 top-2 bottom-2 bg-acid/10 hover:bg-acid/20 text-acid px-6 rounded-full font-bold border border-acid/30 transition-colors">
                                {loading ? 'PROCESSING...' : 'EXECUTE'}
                            </button>
                        </div>
                        {response && (
                            <div className="mt-8 w-full max-w-2xl bg-void/50 border border-acid/30 p-6 text-left relative overflow-y-auto max-h-[50vh] scrollbar-thin scrollbar-thumb-acid scrollbar-track-transparent">
                                <div className="absolute top-0 left-0 w-1 h-full bg-acid"></div>
                                <h3 className="text-acid font-bold text-sm mb-4 uppercase tracking-widest flex items-center gap-2 sticky top-0 bg-[#0d1117]/90 py-2 backdrop-blur-md z-10">
                                    <i data-lucide="sparkles" size="16"></i> AI Intelligence Report
                                </h3>
                                <div className="text-gray-300 font-mono text-sm whitespace-pre-wrap leading-relaxed pt-2">{response}</div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const AuthPage = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        await auth.createUserWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    setError(err.message);
                }
                setLoading(false);
            };

            return (
                <div className="flex-1 flex items-center justify-center relative z-20">
                    <div className="qx-card w-full max-w-md p-8 backdrop-blur-xl bg-void/80 border border-acid/20">
                        <div className="text-center mb-8">
                            <h2 className="text-3xl font-display font-bold text-white mb-2">QUANT<span className="text-acid">X</span></h2>
                            <p className="text-gray-400 font-mono text-xs tracking-widest uppercase">{isLogin ? 'SECURE TERMINAL ACCESS' : 'INITIALIZE NEURAL LINK'}</p>
                        </div>
                        
                        {error && <div className="mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-500 text-xs rounded font-mono">{error}</div>}
                        
                        <form onSubmit={handleAuth} className="space-y-4">
                            <div>
                                <label className="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-widest">Operator ID (Email)</label>
                                <input type="email" value={email} onChange={e => setEmail(e.target.value)} required className="w-full bg-black/50 border border-gray-700 p-3 rounded-lg text-white focus:outline-none focus:border-acid transition-colors" placeholder="user@quantx.ai" />
                            </div>
                            <div>
                                <label className="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-widest">Access Key (Password)</label>
                                <input type="password" value={password} onChange={e => setPassword(e.target.value)} required className="w-full bg-black/50 border border-gray-700 p-3 rounded-lg text-white focus:outline-none focus:border-acid transition-colors" placeholder="••••••••" />
                            </div>
                            <button type="submit" disabled={loading} className="w-full qx-btn-primary py-3 rounded-lg mt-4 text-sm font-bold tracking-widest bg-acid/20 hover:bg-acid/30">
                                {loading ? 'PROCESSING...' : (isLogin ? 'AUTHENTICATE' : 'REGISTER')}
                            </button>
                        </form>
                        
                        <div className="mt-6 text-center">
                            <button onClick={() => setIsLogin(!isLogin)} className="text-gray-500 text-xs font-mono hover:text-acid transition-colors">
                                {isLogin ? 'REQUEST NEW TERMINAL ACCESS' : 'RETURN TO AUTHENTICATION'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ChartingEngine = () => {
            const [data, setData] = useState([]);
            useEffect(() => {
                setData(generateChartData());
            }, []);

            return (
                <div className="h-full flex flex-col space-y-4 pb-10">
                    <div className="flex justify-between items-end border-b border-gray-700/50 pb-2">
                        <div>
                            <h2 className="text-2xl font-display font-bold text-white">ADVANCED TERMINAL</h2>
                            <p className="text-gray-400 text-xs font-mono tracking-widest mt-1">REAL-TIME MARKET ANALYSIS</p>
                        </div>
                        <div className="flex gap-2">
                            <button className="qx-btn-primary px-4 py-1 text-[10px]">1D</button>
                            <button className="qx-btn-primary px-4 py-1 text-[10px] bg-acid/20">1W</button>
                            <button className="qx-btn-primary px-4 py-1 text-[10px]">1M</button>
                        </div>
                    </div>
                    <div className="qx-card flex-1 p-4 min-h-[400px]">
                        <ResponsiveContainer width="100%" height="100%">
                            <AreaChart data={data} margin={{ top: 10, right: 30, left: 0, bottom: 0 }}>
                                <defs>
                                    <linearGradient id="colorPrice" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="5%" stopColor="#34d399" stopOpacity={0.8}/>
                                        <stop offset="95%" stopColor="#34d399" stopOpacity={0}/>
                                    </linearGradient>
                                </defs>
                                <CartesianGrid strokeDasharray="3 3" stroke="#1c1f2e" vertical={false} />
                                <XAxis dataKey="time" stroke="#4b5563" fontSize={10} tickMargin={10} />
                                <YAxis domain={['auto', 'auto']} stroke="#4b5563" fontSize={10} tickFormatter={(val) => '$'+val} />
                                <Tooltip 
                                    contentStyle={{ backgroundColor: '#0a0f1e', borderColor: '#34d399', borderRadius: '12px' }}
                                    itemStyle={{ color: '#34d399' }}
                                    labelStyle={{ color: '#9ca3af' }}
                                />
                                <Area type="monotone" dataKey="price" stroke="#34d399" strokeWidth={2} fillOpacity={1} fill="url(#colorPrice)" />
                            </AreaChart>
                        </ResponsiveContainer>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [authChecking, setAuthChecking] = useState(true);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(u => {
                    setUser(u);
                    setAuthChecking(false);
                });
                return () => unsubscribe();
            }, []);

            if (authChecking) {
                return <div className="h-screen flex items-center justify-center bg-void text-acid font-mono">Initializing Neural Link...</div>;
            }

            if (!user) {
                return (
                    <div className="h-screen flex flex-col font-sans relative z-10 text-gray-300">
                        <ThreeBackground />
                        <div className="absolute top-4 right-4 z-50 px-4 py-2 bg-red-500/10 border border-red-500/30 text-red-500 rounded-full text-xs font-bold flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> OFFLINE
                        </div>
                        <AuthPage />
                    </div>
                );
            }

            return (
                <div className="h-screen flex flex-col font-sans relative z-10 text-gray-300">
                    <ThreeBackground />
                    <BirdAnimation />
                    <div className="qx-dynamic-bg"></div>
                    <Ticker />
                    
                    {/* Header */}
                    <header className="mt-[60px] border-b border-white/10 bg-void/60 backdrop-blur-xl p-4 flex flex-col md:flex-row justify-between items-center z-20 gap-4">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-acid/10 border border-acid/30 shadow-[0_0_10px_rgba(0,255,65,0.2)] flex items-center justify-center w-10 h-10 rounded-full">
                                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" className="w-8 h-8 drop-shadow-[0_0_8px_rgba(212,255,170,0.6)]">
                                    <g fill="#d4ffaa" transform="translate(50,50)">
                                        <path d="M 5,-5 A 40,40 0 0,1 45,-45 A 40,40 0 0,0 45,5 A 40,40 0 0,1 5,-5 Z" />
                                        <path d="M 5,5 A 40,40 0 0,1 45,45 A 40,40 0 0,0 -5,45 A 40,40 0 0,1 5,5 Z" />
                                        <path d="M -5,5 A 40,40 0 0,1 -45,45 A 40,40 0 0,0 -45,-5 A 40,40 0 0,1 -5,5 Z" />
                                        <path d="M -5,-5 A 40,40 0 0,1 -45,-45 A 40,40 0 0,0 5,-45 A 40,40 0 0,1 -5,-5 Z" />
                                    </g>
                                </svg>
                            </div>
                            <h1 className="text-xl font-bold font-display tracking-widest text-white">QUANT<span className="text-acid">X</span></h1>
                        </div>
                        <div className="flex flex-wrap justify-center gap-2 bg-void p-1 border border-gray-800 rounded-full max-w-full">
                            {['dashboard', 'terminal', 'ai lab'].map(tab => (
                                <button 
                                    key={tab}
                                    onClick={() => setActiveTab(tab)}
                                    className={`uppercase text-xs font-bold px-3 md:px-4 py-2 rounded-full transition-all whitespace-nowrap ${activeTab === tab ? 'bg-acid/10 text-acid border border-acid/50 shadow-[0_0_15px_rgba(0,255,65,0.2)]' : 'text-gray-500 hover:text-gray-300 border border-transparent hover:bg-gray-800/50'}`}
                                >
                                    {tab}
                                </button>
                            ))}
                            <button onClick={() => auth.signOut()} className="uppercase text-xs font-bold px-3 md:px-4 py-2 rounded-full text-red-500 hover:bg-red-500/10 transition-all border border-transparent hover:border-red-500/30 whitespace-nowrap">
                                LOGOUT
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 p-6 overflow-y-auto no-scrollbar z-20">
                        <div className="max-w-[1400px] mx-auto h-full">
                            {activeTab === 'dashboard' && <DashboardTab />}
                            {activeTab === 'terminal' && <ChartingEngine />}
                            {activeTab === 'ai lab' && <AILabTab />}
                        </div>
                    </main>

                    {/* Status Footer */}
                    <footer className="fixed bottom-0 left-0 right-0 border-t border-acid/20 bg-void/90 backdrop-blur-sm p-2 px-6 flex justify-between items-center text-xs text-gray-500 z-30 font-mono h-10">
                        <div className="flex items-center gap-4">
                            <div className="flex items-center gap-2 px-3 py-1 rounded-full bg-acid/10 border border-acid/30 text-acid shadow-[0_0_10px_rgba(0,255,65,0.1)]">
                                <div className="w-1.5 h-1.5 rounded-full bg-acid animate-pulse"></div>
                                <span>SECURE UPLINK</span>
                            </div>
                            <span className="hidden md:inline">NODE: QX-ALPHA-01</span>
                        </div>
                        <div className="text-acid/70">
                            TIME: {new Date().toLocaleTimeString()}
                        </div>
                    </footer>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
