<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QuantX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Share+Tech+Mono&display=swap"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}

/* ─── INTRO SCREENS ─────────────────────────────── */
#intro{
  position:fixed;inset:0;z-index:300;
  background:#000;pointer-events:all;
  opacity:1;transition:opacity 1.1s cubic-bezier(.4,0,.2,1);
}
#intro.hidden{opacity:0;pointer-events:none}

/* Screen 1 — black + typing */
#s1{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:1;transition:opacity .7s ease;
}
#s1.fade{opacity:0}
#intro-word{
  font-family:'Orbitron',monospace;font-weight:900;
  font-size:clamp(1.4rem,4.5vw,3.2rem);letter-spacing:.4em;
  color:#39ff6a;text-transform:uppercase;position:relative;
  text-shadow:0 0 30px rgba(57,255,106,.5),0 0 80px rgba(57,255,106,.2);
}
.cursor{
  display:inline-block;width:3px;height:.9em;
  background:#39ff6a;margin-left:6px;vertical-align:middle;
  box-shadow:0 0 8px #39ff6a;
  animation:blink .65s step-end infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ─── LOADING PAGE ──────────────────────────────── */
#c3d{position:fixed;inset:0;z-index:1}

/* particle canvas overlay */
#pCanvas{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;
  transition:opacity 1.4s ease .3s;}
#pCanvas.show{opacity:1}

#ui{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;
}

/* brand */
#brand{
  font-family:'Orbitron',monospace;font-weight:900;
  font-size:clamp(3rem,7vw,5.5rem);letter-spacing:.25em;color:#fff;
  text-shadow:0 0 20px rgba(57,255,106,.6),0 0 60px rgba(57,255,106,.25);
  opacity:0;transform:scale(.7) translateY(40px);
  transition:opacity 1.1s cubic-bezier(.22,1,.36,1),
             transform 1.1s cubic-bezier(.22,1,.36,1);
  position:relative;
}
#brand.show{opacity:1;transform:scale(1) translateY(0)}
#brand b{color:#39ff6a}

.g-copy{
  position:absolute;inset:0;
  font-family:'Orbitron',monospace;font-weight:900;
  font-size:clamp(3rem,7vw,5.5rem);letter-spacing:.25em;
  color:#39ff6a;opacity:0;white-space:nowrap;
}

/* tagline */
#tagline{
  font-family:'Share Tech Mono',monospace;font-size:.56rem;
  letter-spacing:.32em;color:rgba(57,255,106,.45);text-transform:uppercase;
  margin-top:8px;
  opacity:0;transform:translateY(12px);
  transition:opacity 1s ease .35s, transform 1s ease .35s;
  white-space:nowrap;display:flex;align-items:center;justify-content:center;
}
#tagline.show{opacity:1;transform:translateY(0)}
#tagline .sep{color:rgba(57,255,106,.22);margin:0 .55em;font-size:.45rem;}

/* corner brackets */
.corner{
  position:fixed;width:55px;height:55px;
  border-color:rgba(57,255,106,.35);border-style:solid;
  opacity:0;transition:opacity .9s ease;
}
.c-tl{top:22px;left:22px;border-width:2px 0 0 2px}
.c-tr{top:22px;right:22px;border-width:2px 2px 0 0}
.c-bl{bottom:22px;left:22px;border-width:0 0 2px 2px}
.c-br{bottom:22px;right:22px;border-width:0 2px 2px 0}
.corner.show{opacity:1}

/* animated bracket lines */
.c-tl::before,.c-tl::after,
.c-tr::before,.c-tr::after,
.c-bl::before,.c-bl::after,
.c-br::before,.c-br::after{
  content:'';position:absolute;background:rgba(57,255,106,.18);
}
.c-tl::before,.c-tr::before,.c-bl::before,.c-br::before{
  width:1px;top:0;bottom:0;
}
.c-tl::after,.c-tr::after,.c-bl::after,.c-br::after{
  height:1px;left:0;right:0;
}
.c-tl::before,.c-bl::before{left:0}
.c-tr::before,.c-br::before{right:0}
.c-tl::after,.c-tr::after{top:0}
.c-bl::after,.c-br::after{bottom:0}

/* scan line */
.scan{
  position:fixed;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(57,255,106,.1),transparent);
  top:0;z-index:11;opacity:0;transition:opacity .9s ease;
  animation:scanH 6s linear infinite;will-change:transform;
}
.scan.show{opacity:1}
@keyframes scanH{0%{transform:translateY(0)}100%{transform:translateY(100vh)}}

/* horizontal data lines */
.dataline{
  position:fixed;left:0;right:0;height:1px;z-index:11;
  opacity:0;transition:opacity .6s ease;
  background:linear-gradient(90deg,transparent 0%,rgba(57,255,106,.06) 30%,rgba(57,255,106,.06) 70%,transparent 100%);
}
.dataline.show{opacity:1}
#dl1{top:30%} #dl2{top:70%}

/* progress bar zone */
#bzone{
  position:fixed;bottom:68px;left:50%;transform:translateX(-50%);
  width:min(480px,82vw);z-index:12;
  opacity:0;transform:translateX(-50%) translateY(18px);
  transition:opacity .9s ease .5s, transform .9s cubic-bezier(.22,1,.36,1) .5s;
  font-family:'Share Tech Mono',monospace;
}
#bzone.show{opacity:1;transform:translateX(-50%) translateY(0)}
#btop{display:flex;justify-content:space-between;font-size:.62rem;color:rgba(57,255,106,.55);letter-spacing:.15em;margin-bottom:7px}
#btrack{width:100%;height:2px;background:rgba(57,255,106,.08);position:relative;overflow:visible}
#bfill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#0a2e14,#39ff6a,#c0ffd8);
  box-shadow:0 0 14px rgba(57,255,106,.7),0 0 36px rgba(57,255,106,.3);
  transition:width .3s cubic-bezier(.4,0,.2,1);position:relative;
}
#bfill::after{
  content:'';position:absolute;right:-1px;top:-5px;
  width:2px;height:12px;background:#fff;
  box-shadow:0 0 10px #fff,0 0 24px #39ff6a;
}
#sline{
  font-size:.58rem;color:rgba(57,255,106,.4);
  letter-spacing:.1em;margin-top:9px;min-height:1em;
  opacity:0;transition:opacity .4s ease;
}
#sline.show{opacity:1}

/* hex grid overlay */
#hexGrid{
  position:fixed;inset:0;z-index:3;pointer-events:none;
  opacity:0;transition:opacity 2s ease 1s;
}
#hexGrid.show{opacity:1}

/* copyright */
#copy{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  z-index:20;opacity:0;transition:opacity 1s ease .8s;
}
#copy.show{opacity:.4}
#copy img{height:20px;filter:brightness(1.6) drop-shadow(0 0 8px rgba(57,255,106,.5))}


/* ─── BIRD LOGO ─────────────────────────────────── */
#bird-wrap{
  display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;
  opacity:0;transform:translateY(-18px) scale(.85);
  transition:opacity 1.1s cubic-bezier(.22,1,.36,1) .1s,
             transform 1.1s cubic-bezier(.22,1,.36,1) .1s;
}
#bird-wrap.show{opacity:1;transform:translateY(0) scale(1)}
#bird-svg{
  width:clamp(52px,7vw,80px);
  height:auto;
  filter:drop-shadow(0 0 12px rgba(57,255,106,.8))
         drop-shadow(0 0 28px rgba(57,255,106,.4));
  animation:birdFloat 3.8s ease-in-out infinite;
}
@keyframes birdFloat{
  0%,100%{transform:translateY(0px) rotate(-1deg)}
  50%{transform:translateY(-7px) rotate(1.5deg)}
}


/* ─── SCREEN 3: BIRD FLIGHT ──────────────────────────────── */
#s3{
  position:absolute;inset:0;
  background:#000;
  opacity:0; pointer-events:none;
  transition:opacity .5s ease;
  overflow:hidden;
}

/* The flying bird element */
#cineBird{
  position:absolute;
  width:clamp(36px,5vw,56px);
  height:auto;
  opacity:0;
  will-change:transform,opacity;
  filter:drop-shadow(0 0 18px rgba(57,255,106,1))
         drop-shadow(0 0 40px rgba(57,255,106,.6))
         drop-shadow(0 0 80px rgba(57,255,106,.3));
  transform-origin:center center;
}

/* trail canvas behind bird */
#trailCanvas{
  position:absolute;inset:0;
  pointer-events:none;
}

/* cinematic letterbox bars */
#lbTop,#lbBot{
  position:absolute;left:0;right:0;
  height:10vh;background:#000;z-index:10;
  transition:height .6s cubic-bezier(.4,0,.2,1);
}
#lbTop{top:0;}
#lbBot{bottom:0;}

/* speed lines canvas */
#speedCanvas{
  position:absolute;inset:0;
  pointer-events:none;opacity:0;
}

/* flash & veil */
#flash{position:fixed;inset:0;z-index:50;background:radial-gradient(circle, #c0ffd0 0%, #39ff6a 40%, #0a2e14 100%);opacity:0;pointer-events:none;transition:opacity 2.5s ease}
#veil{position:fixed;inset:0;z-index:60;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s ease}

/* Ripple Effect */
#ripple-wrap {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 100; pointer-events: none;
}
.ripple {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 2px solid #39ff6a;
  box-shadow: 0 0 15px #39ff6a, inset 0 0 15px #39ff6a;
  opacity: 0;
  width: 0; height: 0;
}
.ripple.active {
  animation: rippleAnim 2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}
@keyframes rippleAnim {
  0% { width: 0; height: 0; opacity: 1; border-width: 4px; }
  100% { width: 60vw; height: 60vw; opacity: 0; border-width: 1px; }
}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════
   1. CINEMATIC INTRO
═══════════════════════════════════════════════════ */
(function runIntro(){
  const intro  = document.getElementById('intro');
  const s1     = document.getElementById('s1');
  const itext  = document.getElementById('itext');

  const word = 'introducing';
  let idx = 0;

  function type(){
    if(idx < word.length){
      itext.textContent += word[idx++];
      const p = idx / word.length;
      setTimeout(type, p < 0.25 ? 130 : p < 0.75 ? 65 : 115);
    } else {
      setTimeout(launchBirdFlight, 700);
    }
  }

  function launchBirdFlight(){
    const s3 = document.getElementById('s3');
    const bird = document.getElementById('cineBird');
    const trailCv = document.getElementById('trailCanvas');
    const speedCv = document.getElementById('speedCanvas');
    const tCtx = trailCv.getContext('2d');
    const sCtx = speedCv.getContext('2d');

    /* fade s1 → s3 */
    s1.classList.add('fade');
    setTimeout(()=>{
      s3.style.opacity = '1';
      bird.style.opacity = '1';
    }, 350);

    /* size canvases */
    const W = window.innerWidth, H = window.innerHeight;
    trailCv.width = speedCv.width = W;
    trailCv.height = speedCv.height = H;

    /* ── Bezier flight path ──────────────────────────────────
       Start: far left, vertically centered
       Control1: upper-left quarter (bird swoops up)
       Control2: upper-right quarter (banking right)
       End: screen center (where it "lands" into the loader)
    ─────────────────────────────────────────────────────── */
    const startX = -80, startY = H * 0.55;
    const cp1x   = W  * 0.25, cp1y = H * 0.15;   // sweep upward
    const cp2x   = W  * 0.65, cp2y = H * 0.30;   // arc right
    const endX   = W  * 0.5,  endY = H * 0.5;    // center landing

    let progress = 0;
    const DURATION = 2200; // ms — total flight time
    let startTime = null;
    let prevX = startX, prevY = startY;
    const trailPoints = [];

    /* speed-line burst at launch */
    function drawSpeedLines(alpha){
      sCtx.clearRect(0,0,W,H);
      sCtx.save();
      const count = 28;
      for(let i=0;i<count;i++){
        const angle = (i/count)*Math.PI*2;
        const len   = (60 + Math.random()*120) * alpha;
        const cx = W/2, cy = H/2;
        sCtx.beginPath();
        sCtx.moveTo(cx + Math.cos(angle)*40, cy + Math.sin(angle)*40);
        sCtx.lineTo(cx + Math.cos(angle)*(40+len), cy + Math.sin(angle)*(40+len));
        sCtx.strokeStyle = `rgba(57,255,106,${0.35*alpha})`;
        sCtx.lineWidth = 1 + Math.random()*1.5;
        sCtx.stroke();
      }
      sCtx.restore();
    }

    function cubicBezier(t, p0, p1, p2, p3){
      const u=1-t;
      return u*u*u*p0 + 3*u*u*t*p1 + 3*u*t*t*p2 + t*t*t*p3;
    }

    function wingFlap(t){
      /* returns scale-y for wing flap effect */
      return 1 + Math.sin(t * Math.PI * 14) * 0.08;
    }

    function animateBird(ts){
      if(!startTime) startTime = ts;
      const elapsed = ts - startTime;
      progress = Math.min(elapsed / DURATION, 1);

      /* easing: ease-in then fast rush at end */
      const eased = progress < 0.7
        ? progress * progress * (1/0.49) * 0.7           // ease-in
        : 0.7 + (progress - 0.7) * (1 + (progress-0.7)*4); // accelerate

      const p = Math.min(eased, 1);

      const bx = cubicBezier(p, startX, cp1x, cp2x, endX);
      const by = cubicBezier(p, startY, cp1y, cp2y, endY);

      /* angle: tangent of bezier */
      const dp = Math.min(p + 0.01, 1);
      const nx = cubicBezier(dp, startX, cp1x, cp2x, endX);
      const ny = cubicBezier(dp, startY, cp1y, cp2y, endY);
      const angle = Math.atan2(ny - by, nx - bx);

      /* scale: starts small (distant), grows as it approaches */
      const baseScale = 0.3 + p * 1.4;
      const scaleY = baseScale * wingFlap(progress);

      /* speed-blur: more at start and end rush */
      const speed = Math.hypot(bx - prevX, by - prevY);
      const blurAlpha = Math.min(speed / 18, 1);

      /* position the SVG bird */
      bird.style.left = (bx - 50) + 'px';
      bird.style.top  = (by - 35) + 'px';
      bird.style.transform = `rotate(${angle}rad) scaleX(${baseScale}) scaleY(${scaleY})`;
      bird.style.filter = `drop-shadow(0 0 ${12+speed*2}px rgba(57,255,106,1))
                           drop-shadow(0 0 ${30+speed*3}px rgba(57,255,106,.7))
                           drop-shadow(0 0 80px rgba(57,255,106,.3))`;

      /* draw glowing trail */
      trailPoints.push({x:bx, y:by, a:1.0});
      tCtx.clearRect(0,0,W,H);
      for(let i=1;i<trailPoints.length;i++){
        const pt = trailPoints[i];
        const ppt = trailPoints[i-1];
        pt.a = Math.max(0, pt.a - 0.018);
        if(pt.a <= 0) continue;
        const w = Math.max(1, (i/trailPoints.length) * 4);
        tCtx.beginPath();
        tCtx.moveTo(ppt.x, ppt.y);
        tCtx.lineTo(pt.x, pt.y);
        tCtx.strokeStyle = `rgba(57,255,106,${pt.a * 0.6})`;
        tCtx.lineWidth = w;
        tCtx.lineCap = 'round';
        tCtx.shadowBlur = 12;
        tCtx.shadowColor = '#39ff6a';
        tCtx.stroke();
        tCtx.shadowBlur = 0;
      }
      /* clean up faded trail points */
      while(trailPoints.length > 0 && trailPoints[0].a <= 0) trailPoints.shift();

      prevX = bx; prevY = by;

      if(progress < 1){
        requestAnimationFrame(animateBird);
      } else {
        /* bird reached center — impact flash + explode into loader */
        bird.style.transition = 'opacity .25s ease, transform .3s ease';
        bird.style.opacity = '0';
        bird.style.transform += ' scale(3)';

        // Trigger ripple
        const ripples = document.querySelectorAll('.ripple');
        ripples.forEach((r, i) => {
          setTimeout(() => r.classList.add('active'), i * 150);
        });

        /* burst speed lines */
        speedCv.style.opacity = '1';
        let burst = 1.0;
        function burstAnim(){
          drawSpeedLines(burst);
          burst -= 0.07;
          if(burst > 0) requestAnimationFrame(burstAnim);
          else { speedCv.style.opacity='0'; sCtx.clearRect(0,0,W,H); }
        }
        burstAnim();

        /* big flash then reveal loader */
        const fl = document.getElementById('flash');
        fl.style.transition='none'; fl.style.opacity='1';
        setTimeout(()=>{
          fl.style.transition='opacity 2.5s ease-in-out';
          fl.style.opacity='0';
          s3.style.transition='opacity 1s ease';
          s3.style.opacity='0';
          setTimeout(()=>{
            intro.classList.add('hidden');
            setTimeout(()=>{ intro.style.display='none'; }, 2500);
          }, 200);
        }, 150);
      }
    }

    setTimeout(()=>{ requestAnimationFrame(animateBird); }, 400);
  }

  setTimeout(type, 400);

})();

function ring(r,tube,rx,ry,rz,op){
  const m=new THREE.Mesh(new THREE.TorusGeometry(r,tube,8,100),new THREE.MeshBasicMaterial({color:0x39ff6a,transparent:true,opacity:op}));
  m.rotation.set(rx,ry,rz); scene.add(m); return m;
}

function revealLoader(){

  setTimeout(()=>{
    document.getElementById('pCanvas').classList.add('show');
    document.getElementById('hexGrid').classList.add('show');
    ['dl1','dl2'].forEach(id=>document.getElementById(id).classList.add('show'));
  },0);

  setTimeout(()=>{
    ['ctl','ctr','cbl','cbr'].forEach((id,i)=>
      setTimeout(()=>document.getElementById(id).classList.add('show'), i*120));
  },200);

  setTimeout(()=>{ document.getElementById('scan').classList.add('show'); },500);
  setTimeout(()=>{ revealIcon(); },300);
}

function revealIcon(){
  let t=0;
  const iv=setInterval(()=>{
    t+=.028;
    const op=Math.min(t,1),em=op*.8;
    if(iconA){ iconA.material.opacity=op; iconA.material.emissiveIntensity=em; }
    if(iconB){ iconB.material.opacity=op; iconB.material.emissiveIntensity=em; }
    if(t>=1) clearInterval(iv);
  },20);
  fireShockwaves(); doFlash(.5);
  setTimeout(showUI,300);
}

function showUI(){

}

/* ═══════════════════════════════════════════════════
   3. PARTICLE CANVAS (2D overlay sparkles)
═══════════════════════════════════════════════════ */
(function initParticles(){
  const cv=document.getElementById('pCanvas');
  const ctx=cv.getContext('2d');
  cv.width=W(); cv.height=H();
  window.addEventListener('resize',()=>{cv.width=W();cv.height=H();});

  const particles=[];
  for(let i=0;i<25;i++){
    particles.push({
      x:Math.random()*W(), y:Math.random()*H(),
      vx:(Math.random()-.5)*.18, vy:(Math.random()-.5)*.18,
      r:Math.random()*1.4+.3,
      a:Math.random(), da:(Math.random()-.5)*.012,
      hue:100+Math.random()*40
    });
  }

  function drawParticles(){
    ctx.clearRect(0,0,cv.width,cv.height);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      p.a+=p.da;
      if(p.a<0||p.a>1) p.da*=-1;
      if(p.x<0) p.x=cv.width; if(p.x>cv.width) p.x=0;
      if(p.y<0) p.y=cv.height; if(p.y>cv.height) p.y=0;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.hue},100%,65%,${p.a*0.55})`;
      ctx.fill();
    });
    requestAnimationFrame(drawParticles);
  }
  drawParticles();
})();

/* ═══════════════════════════════════════════════════
   4. SVG HEX GRID (very subtle background pattern)
═══════════════════════════════════════════════════ */
(function buildHexGrid(){
  const svg=document.getElementById('hexGrid');
  svg.setAttribute('viewBox',`0 0 ${W()} ${H()}`);
  svg.setAttribute('width',W()); svg.setAttribute('height',H());
  const size=38, rows=Math.ceil(H()/(size*1.73))+1, cols=Math.ceil(W()/(size*2))+1;
  let d='';
  for(let row=0;row<rows;row++){
    for(let col=0;col<cols;col++){
      const cx=col*size*1.75+(row%2)*size*.875;
      const cy=row*size*1.52;
      const pts=[];
      for(let a=0;a<6;a++){
        const ang=Math.PI/180*(60*a-30);
        pts.push(`${(cx+size*.45*Math.cos(ang)).toFixed(1)},${(cy+size*.45*Math.sin(ang)).toFixed(1)}`);
      }
      d+=`M${pts.join('L')}Z`;
    }
  }
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',d);
  path.setAttribute('fill','none');
  path.setAttribute('stroke','rgba(57,255,106,0.04)');
  path.setAttribute('stroke-width','1');
  svg.appendChild(path);
})();

let t=0;
(function loop(){
  requestAnimationFrame(loop);
  const dt=clock.getDelta(); t+=dt;

  keyL.position.set(3.5*Math.sin(t*1.2),2.5*Math.cos(t*.8),2*Math.cos(t*1.4));

  /* icon rotation — full 360° per icon before switch */
  if(iconGroup && iconReady){
    const spinSpeed=.004;
    logoAngle+=spinSpeed;
    iconGroup.rotation.y=logoAngle;
    iconGroup.position.y=Math.sin(t*.9)*.12;

    const phase=logoAngle%(Math.PI*2);
    const edgeOn=Math.abs(phase-Math.PI)<spinSpeed*2;

    if(edgeOn && lastFace===0){
      lastFace=1; doFlash(.28); fireShockwaves();
    } else if(!edgeOn && phase<Math.PI && lastFace===1){
      lastFace=0; doFlash(.28); fireShockwaves();
    }

    const showA=(lastFace===0);
    if(iconA) iconA.material.opacity=showA?1:0;
    if(iconB) iconB.material.opacity=showA?0:1;
    const em=1.0+.6*Math.sin(t*2.4);
    if(iconA) iconA.material.emissiveIntensity=showA?em:0;
    if(iconB) iconB.material.emissiveIntensity=showA?0:em;
  }

  cage1.rotation.x+=.003; cage1.rotation.y+=.004; cage1.rotation.z+=.0018;
  cage2.rotation.x-=.0025; cage2.rotation.y+=.005; cage2.rotation.z-=.0032;
  cage3.rotation.x+=.0018; cage3.rotation.y-=.0035; cage3.rotation.z+=.0025;

  r1.rotation.z+=.007;
  r2.rotation.x+=.004; r2.rotation.y+=.003;
  r3.rotation.y-=.005; r3.rotation.z+=.004;
  r4.rotation.x+=.0025; r4.rotation.z-=.003;

  const pa=pg.attributes.position.array;
  for(let i=0;i<PN;i++){
    pv[i].th+=pv[i].dth; pv[i].ph+=pv[i].dph;
    const {th,ph,r}=pv[i];
    pa[i*3]=r*Math.sin(ph)*Math.cos(th);
    pa[i*3+1]=r*Math.sin(ph)*Math.sin(th);
    pa[i*3+2]=r*Math.cos(ph);
  }
  pg.attributes.position.needsUpdate=true;
  pts.rotation.y+=.001;

  sw.forEach(s=>{
    if(!s.active) return;
    s.r+=s.speed;
    s.mesh.geometry.dispose();
    const outerR=s.r+Math.max(.01,.35*(1-s.r/10));
    s.mesh.geometry=new THREE.RingGeometry(s.r,outerR,80);
    s.mesh.material.opacity=Math.max(0,s.fade*(1-s.r/10));
    if(s.r>10){s.active=false;s.mesh.material.opacity=0;}
  });

  camera.position.z=5+.18*Math.sin(t*.38);
  camera.position.x=.1*Math.sin(t*.25);
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
})();

window.addEventListener('resize',()=>{
  renderer.setSize(W(),H());
  camera.aspect=W()/H();
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
